<!doctype html>
<html
  lang="en"
  data-composition-variables='[{"id":"accent","type":"color","label":"Tag accent","default":"#e15b52"}]'
>
  <head></head>
  <body>
    <template
      ><style>
        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
        .hpm-fill {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #f0eee8;
          font-family: Inter, sans-serif;
          color: #292824;
          --accent: #e15b52;
        }
        .hpm-type {
          position: absolute;
          left: 0;
          top: 420px;
          width: 100%;
          text-align: center;
          font-size: 116px;
          font-weight: 800;
          letter-spacing: -4px;
        }
        .hpm-caret {
          display: inline-block;
          width: 16px;
          height: 112px;
          margin-left: 10px;
          vertical-align: -16px;
          background: var(--accent);
        }
        .hpm-pill {
          position: absolute;
          left: 590px;
          top: 410px;
          width: 740px;
          height: 236px;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 28px;
          border-radius: 118px;
          background: #d9d7d1;
          font-size: 116px;
          font-weight: 800;
          transform-origin: 0 0;
          opacity: 0;
        }
        .hpm-pill b {
          width: 72px;
          height: 72px;
          border-radius: 50%;
          background: var(--accent);
        }
        .hpm-page {
          position: absolute;
          inset: 0;
          padding: 110px 150px;
          background: #faf8f2;
          opacity: 0;
        }
        .hpm-page h1 {
          font-size: 84px;
          margin-bottom: 70px;
        }
        .hpm-page p {
          width: 1180px;
          margin-top: 170px;
          font-size: 30px;
          line-height: 1.7;
          color: #5f5d58;
        }
        .hpm-slot {
          position: absolute;
          left: 150px;
          top: 255px;
          width: 407px;
          height: 130px;
          border-radius: 65px;
          background: #f0d8d4;
        }
        .hpm-slot span {
          display: grid;
          place-items: center;
          height: 100%;
          font-size: 64px;
          font-weight: 800;
          color: #7b332f;
        }
        .hpm-caption {
          position: absolute;
          left: 62px;
          bottom: 48px;
          color: #65635e;
          font-size: 18px;
          font-weight: 800;
          letter-spacing: 4px;
        }
      </style>
      <div
        data-hf-id="hf-hpm-root"
        id="hpm-root"
        data-composition-id="shot-hashtag-pill-materialize"
        data-start="0"
        data-duration="3.5"
        data-width="1920"
        data-height="1080"
        style="
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
        "
      >
        <div class="hpm-fill">
          <div id="hpm-type" class="hpm-type">
            <span id="hpm-word"></span><i class="hpm-caret"></i>
          </div>
          <div id="hpm-pill" class="hpm-pill"><b></b><span>focus</span></div>
          <div id="hpm-page" class="hpm-page">
            <h1>Deep work notes</h1>
            <div class="hpm-slot"><span>focus</span></div>
            <p>
              A calm workspace for ideas that deserve uninterrupted attention.
              Capture the thought, shape the argument, and keep the signal
              close.
            </p>
          </div>
          <div class="hpm-caption">TYPE · CUT · PLACE · CUT</div>
        </div>
      </div>
      <script>
        (function () {
          window.__timelines = window.__timelines || {};
          var v = window.__hyperframes.getVariables(),
            fill = document.querySelector("#hpm-root .hpm-fill"),
            word = document.getElementById("hpm-word"),
            tl = gsap.timeline({ paused: true }),
            txt = "#focus";
          fill.style.setProperty("--accent", v.accent || "#e15b52");
          txt.split("").forEach(function (ch, i) {
            tl.call(
              function () {
                word.textContent = txt.slice(0, i + 1);
              },
              null,
              0.15 + i * 0.17,
            );
          });
          tl.set("#hpm-type", { opacity: 0 }, 1.3)
            .set("#hpm-pill", { opacity: 1, scale: 1.03 }, 1.3)
            .to("#hpm-pill", { scale: 1, duration: 0.1 }, 1.3)
            .to(
              "#hpm-pill",
              {
                x: -440,
                y: -155,
                scale: 0.55,
                duration: 0.467,
                ease: "power2.inOut",
              },
              1.9,
            )
            .set("#hpm-page", { opacity: 1 }, 2.467)
            .set("#hpm-pill", { opacity: 0 }, 2.467);
          window.__timelines["shot-hashtag-pill-materialize"] = tl;
        })();
      </script></template
    >
  </body>
</html>
