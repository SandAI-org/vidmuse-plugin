<!doctype html>
<html
  lang="en"
  data-composition-variables='[{"id":"accent","type":"color","label":"Burst accent","default":"#b45309"}]'
>
  <head></head>
  <body>
    <template>
      <style>
        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
        .ibk-fill {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #e9e7e2;
          font-family: Inter, sans-serif;
          color: #292824;
        }
        .ibk-title {
          position: absolute;
          left: 120px;
          top: 96px;
          font-size: 54px;
          font-weight: 900;
        }
        .ibk-card {
          position: absolute;
          top: 400px;
          width: 400px;
          height: 280px;
          padding: 34px;
          border: 2px solid #c9c6bf;
          border-radius: 18px;
          background: #faf9f5;
          box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
          transform-origin: center bottom;
        }
        .ibk-l {
          left: 300px;
        }
        .ibk-m {
          left: 760px;
        }
        .ibk-r {
          left: 1220px;
        }
        .ibk-k {
          width: 120px;
          height: 14px;
          border-radius: 7px;
          background: var(--accent);
        }
        .ibk-v {
          width: 220px;
          height: 44px;
          margin-top: 30px;
          border-radius: 10px;
          background: #65635d;
        }
        .ibk-lines {
          height: 84px;
          margin-top: 36px;
          border-radius: 10px;
          background: repeating-linear-gradient(
            to bottom,
            #d0cdc6 0 11px,
            transparent 11px 25px
          );
        }
        .ibk-ring {
          position: absolute;
          left: 60px;
          top: -360px;
          width: 1800px;
          height: 1800px;
          border: 3px solid #292824;
          border-radius: 50%;
          opacity: 0;
          transform-origin: center;
        }
        .ibk-particle {
          position: absolute;
          left: 952px;
          top: 532px;
          width: 16px;
          height: 16px;
          background: #292824;
          opacity: 0;
        }
      </style>
      <div
        data-hf-id="hf-ibk-root"
        id="ibk-root"
        data-composition-id="shot-impact-burst-kit"
        data-start="0"
        data-duration="4.667"
        data-width="1920"
        data-height="1080"
        style="
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
        "
      >
        <div class="ibk-fill" style="--accent: #b45309">
          <div id="ibk-shake">
            <div class="ibk-title">IMPACT BURST KIT</div>
            <article id="ibk-left" class="ibk-card ibk-l">
              <div class="ibk-k"></div>
              <div class="ibk-v"></div>
              <div class="ibk-lines"></div>
            </article>
            <article
              id="ibk-main"
              class="ibk-card ibk-m"
              data-layout-allow-overflow
            >
              <div class="ibk-k"></div>
              <div class="ibk-v"></div>
              <div class="ibk-lines"></div>
            </article>
            <article id="ibk-right" class="ibk-card ibk-r">
              <div class="ibk-k"></div>
              <div class="ibk-v"></div>
              <div class="ibk-lines"></div>
            </article>
            <div id="ibk-particles"></div>
            <div
              id="ibk-ring"
              class="ibk-ring"
              data-layout-allow-overflow
            ></div>
          </div>
        </div>
      </div>
      <script>
        (function () {
          window.__timelines = window.__timelines || {};
          var v = window.__hyperframes.getVariables(),
            root = document.getElementById("ibk-root"),
            fill = root.querySelector(".ibk-fill"),
            host = document.getElementById("ibk-particles"),
            tl = gsap.timeline({ paused: true });
          fill.style.setProperty("--accent", v.accent || "#b45309");
          for (var i = 0; i < 14; i++) {
            var p = document.createElement("i"),
              h = Math.abs(Math.sin((i + 1) * 127.3)),
              a = -Math.PI / 2 + (h - 0.5) * Math.PI * 1.7,
              dist = 160 + Math.abs(Math.sin((i + 40) * 127.3)) * 180;
            p.className = "ibk-particle";
            p.id = "ibk-p-" + i;
            p.style.borderRadius = i % 2 ? "50%" : "2px";
            host.appendChild(p);
            tl.set(p, { opacity: 1, scale: 1 }, 0.667).to(
              p,
              {
                x: Math.cos(a) * dist,
                y: Math.sin(a) * dist,
                opacity: 0,
                scale: 0,
                duration: 0.733,
                ease: "power3.out",
              },
              0.667,
            );
          }
          gsap.set("#ibk-main", { scale: 1.8, y: -120 });
          gsap.set("#ibk-ring", { scale: 0.089, opacity: 0 });
          tl.to(
            "#ibk-main",
            { scale: 1, y: 0, duration: 0.2, ease: "power3.in" },
            0.467,
          )
            .to(
              "#ibk-main",
              { scaleX: 1.07, scaleY: 0.9, duration: 0.1, ease: "power2.out" },
              0.667,
            )
            .to(
              "#ibk-main",
              { scaleX: 1, scaleY: 1, duration: 0.1, ease: "back.out(2)" },
              0.767,
            )
            .set("#ibk-ring", { opacity: 0.75 }, 0.667)
            .to(
              "#ibk-ring",
              { scale: 1, opacity: 0, duration: 0.467, ease: "power3.out" },
              0.667,
            )
            .to(
              "#ibk-shake",
              {
                keyframes: [
                  { x: 5, y: -3, duration: 0.034 },
                  { x: -3, y: 2, duration: 0.034 },
                  { x: 2, y: -1, duration: 0.034 },
                  { x: 0, y: 0, duration: 0.034 },
                ],
                ease: "none",
              },
              0.667,
            )
            .to(
              "#ibk-left",
              {
                keyframes: [
                  { x: -30, rotation: -3, duration: 0.1 },
                  { x: 10, rotation: 1, duration: 0.16 },
                  { x: -5, rotation: -0.5, duration: 0.2 },
                  { x: 0, rotation: 0, duration: 0.7 },
                ],
                ease: "power2.out",
              },
              0.767,
            )
            .to(
              "#ibk-right",
              {
                keyframes: [
                  { x: 30, rotation: 3, duration: 0.1 },
                  { x: -10, rotation: -1, duration: 0.16 },
                  { x: 5, rotation: 0.5, duration: 0.2 },
                  { x: 0, rotation: 0, duration: 0.7 },
                ],
                ease: "power2.out",
              },
              0.767,
            );
          window.__timelines["shot-impact-burst-kit"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
