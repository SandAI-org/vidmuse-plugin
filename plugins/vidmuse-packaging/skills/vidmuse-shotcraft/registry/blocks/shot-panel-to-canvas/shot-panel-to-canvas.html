<!doctype html>
<html
  lang="en"
  data-composition-variables='[{"id":"accent","type":"color","label":"Action accent","default":"#2d2d2b"}]'
>
  <head></head>
  <body>
    <template>
      <style>
        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
        .ptc-fill {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #ecebe6;
          font-family: Inter, sans-serif;
          color: #292824;
          --accent: #2d2d2b;
          background-image: radial-gradient(#cbc9c2 2px, transparent 2px);
          background-size: 52px 52px;
        }
        .ptc-panel {
          position: absolute;
          left: 1210px;
          top: 90px;
          width: 620px;
          height: 900px;
          padding: 28px;
          border: 2px solid #c9c7c0;
          border-radius: 20px;
          background: #f6f5f1;
          box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        .ptc-h1 {
          width: 260px;
          height: 20px;
          margin-bottom: 14px;
          border-radius: 10px;
          background: #77756f;
        }
        .ptc-h2 {
          width: 380px;
          height: 12px;
          margin-bottom: 26px;
          border-radius: 6px;
          background: #d2d0c9;
        }
        .ptc-tablehead {
          height: 34px;
          margin-bottom: 12px;
          border-radius: 8px;
          background: #dddcd6;
        }
        .ptc-slot {
          height: 80px;
          margin-bottom: 12px;
          border: 2px dashed #c8c6bf;
          border-radius: 10px;
        }
        .ptc-row {
          position: absolute;
          left: 30px;
          width: 560px;
          height: 80px;
          display: flex;
          align-items: center;
          gap: 18px;
          padding: 0 20px;
          border: 2px solid #c9c7c0;
          border-radius: 10px;
          background: #faf9f5;
        }
        .ptc-box {
          width: 30px;
          height: 30px;
          display: grid;
          place-items: center;
          border: 3px solid #85837d;
          border-radius: 8px;
          color: #fff;
          font-weight: 900;
        }
        .ptc-row i {
          width: 190px;
          height: 14px;
          border-radius: 7px;
          background: #77756f;
        }
        .ptc-button {
          position: absolute;
          left: 28px;
          right: 28px;
          bottom: 28px;
          height: 64px;
          display: grid;
          place-items: center;
          border-radius: 14px;
          background: #6c6a65;
          color: #fff;
          font-size: 22px;
          font-weight: 800;
        }
        .ptc-flyer {
          position: absolute;
          width: 560px;
          height: 80px;
          overflow: hidden;
          border: 2px solid #c9c7c0;
          border-radius: 10px;
          background: #faf9f5;
          box-shadow: 0 18px 38px rgba(0, 0, 0, 0.16);
          opacity: 0;
        }
        .ptc-rowform,
        .ptc-cardform {
          position: absolute;
          inset: 0;
        }
        .ptc-rowform {
          display: flex;
          align-items: center;
          gap: 18px;
          padding: 0 20px;
        }
        .ptc-rowform i:first-child {
          width: 30px;
          height: 30px;
          border-radius: 8px;
          background: var(--accent);
        }
        .ptc-rowform i:last-child {
          width: 210px;
          height: 14px;
          border-radius: 7px;
          background: #77756f;
        }
        .ptc-cardform {
          padding: 24px;
          opacity: 0;
        }
        .ptc-cardform i {
          display: block;
          width: 62%;
          height: 18px;
          margin-bottom: 14px;
          border-radius: 9px;
          background: #77756f;
        }
        .ptc-cardform i:nth-child(n + 2) {
          width: 84%;
          height: 11px;
          background: #d0cec7;
        }
        .ptc-cardform b {
          position: absolute;
          left: 24px;
          bottom: 24px;
          width: 28px;
          height: 28px;
          border-radius: 50%;
          background: #999791;
        }
        .ptc-cursor {
          position: absolute;
          width: 42px;
          height: 46px;
          z-index: 50;
        }
        .ptc-caption {
          position: absolute;
          left: 62px;
          bottom: 48px;
          color: #65635e;
          font-size: 18px;
          font-weight: 800;
          letter-spacing: 4px;
        }
      </style>
      <div
        data-hf-id="hf-ptc-root"
        id="ptc-root"
        data-composition-id="shot-panel-to-canvas"
        data-start="0"
        data-duration="4.333"
        data-width="1920"
        data-height="1080"
        style="
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
        "
      >
        <div class="ptc-fill">
          <aside class="ptc-panel">
            <div class="ptc-h1"></div>
            <div class="ptc-h2"></div>
            <div class="ptc-tablehead"></div>
            <div id="ptc-slots"></div>
            <div id="ptc-rows"></div>
            <button id="ptc-button" class="ptc-button">
              Add all to canvas
            </button>
          </aside>
          <div id="ptc-flyers"></div>
          <svg id="ptc-cursor" class="ptc-cursor" viewBox="0 0 20 22">
            <path
              d="M2 1V17l4.5-3.8L9.4 20l3-1.3-2.9-6.7 5.5-.4Z"
              fill="#292824"
              stroke="#fff"
              stroke-width="1.4"
            />
          </svg>
          <div class="ptc-caption">SELECT → LAUNCH → MATERIALIZE</div>
        </div>
      </div>
      <script>
        (function () {
          window.__timelines = window.__timelines || {};
          var v = window.__hyperframes.getVariables(),
            fill = document.querySelector("#ptc-root .ptc-fill"),
            slots = document.getElementById("ptc-slots"),
            rows = document.getElementById("ptc-rows"),
            flies = document.getElementById("ptc-flyers"),
            tl = gsap.timeline({ paused: true }),
            targets = [
              [150, 150, -2],
              [480, 420, 1.5],
              [180, 660, 2],
            ],
            starts = [1.8, 2, 2.2];
          fill.style.setProperty("--accent", v.accent || "#2d2d2b");
          for (var i = 0; i < 3; i++) {
            var s = document.createElement("div"),
              r = document.createElement("div"),
              f = document.createElement("div");
            s.className = "ptc-slot";
            slots.appendChild(s);
            r.className = "ptc-row";
            r.style.top = 154 + i * 92 + "px";
            r.innerHTML =
              '<b class="ptc-box"></b><i style="width:' +
              (180 + i * 40) +
              'px"></i>';
            rows.appendChild(r);
            f.className = "ptc-flyer";
            f.style.left = "1240px";
            f.style.top = 210 + i * 92 + "px";
            f.innerHTML =
              '<div class="ptc-rowform"><i></i><i></i></div><div class="ptc-cardform"><i></i><i></i><i></i><b></b></div>';
            flies.appendChild(f);
            (function (idx, row, fly) {
              tl.to(
                row.querySelector("b"),
                {
                  backgroundColor: v.accent || "#2d2d2b",
                  borderColor: v.accent || "#2d2d2b",
                  scale: 1.12,
                  duration: 0.16,
                  yoyo: true,
                  repeat: 1,
                },
                [0.4, 0.733, 1.067][idx],
              )
                .set(
                  row.querySelector("b"),
                  { textContent: "✓" },
                  [0.4, 0.733, 1.067][idx],
                )
                .to(row, { opacity: 0, duration: 0.1 }, starts[idx])
                .set(fly, { opacity: 1 }, starts[idx])
                .to(
                  fly,
                  {
                    keyframes: [
                      {
                        x: -300,
                        y: -170,
                        width: 520,
                        height: 140,
                        duration: 0.45,
                      },
                      {
                        x: targets[idx][0] - 1240,
                        y: targets[idx][1] - (210 + idx * 92),
                        width: 480,
                        height: 240,
                        rotation: targets[idx][2],
                        borderRadius: 18,
                        duration: 0.68,
                      },
                    ],
                    ease: "power2.out",
                  },
                  starts[idx],
                )
                .to(
                  fly.querySelector(".ptc-rowform"),
                  { opacity: 0, duration: 0.2 },
                  starts[idx] + 0.25,
                )
                .to(
                  fly.querySelector(".ptc-cardform"),
                  { opacity: 1, duration: 0.3 },
                  starts[idx] + 0.5,
                );
            })(i, r, f);
          }
          gsap.set("#ptc-cursor", { x: 900, y: 560 });
          tl.to(
            "#ptc-cursor",
            { x: 1500, y: 900, duration: 1.267, ease: "power2.inOut" },
            0.267,
          ).to(
            "#ptc-button",
            {
              scale: 0.94,
              backgroundColor: v.accent || "#2d2d2b",
              duration: 0.1,
              yoyo: true,
              repeat: 1,
            },
            1.533,
          );
          window.__timelines["shot-panel-to-canvas"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
