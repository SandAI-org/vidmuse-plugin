          height: 13px;
          margin-bottom: 16px;

          background: #252925;
        }
        .trb-card i + i {

          background: #b7b5ae;
        }
        .trb-card:after {
          content: "";
          display: block;
          height: 165px;
          margin-top: 60px;
          border-radius: 16px;

          border-color: #3b423f;

          background: #f1eee7;
        }
        .trb-black {
          position: absolute;
          inset: 0;
          opacity: 0;
          background: #000;
        }
        .trb-open {

          inset: 0;
          opacity: 0;
