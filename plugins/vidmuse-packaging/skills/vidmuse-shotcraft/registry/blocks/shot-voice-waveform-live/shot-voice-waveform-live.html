<!doctype html>
<html
  lang="en"
  data-composition-variables='[{"id":"accent","type":"color","label":"Voice accent","default":"#7fd7ff"}]'
>
  <head></head>
  <body>
    <template
      ><style>
        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
        .vwl-fill {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: radial-gradient(circle at 50% 45%, #202734, #090b10 72%);
          font-family: Inter, sans-serif;
          color: #f5f7fa;
          --accent: #7fd7ff;
        }
        .vwl-title {
          position: absolute;
          top: 235px;
          width: 100%;
          text-align: center;
          font-size: 54px;
          font-weight: 850;
        }
        .vwl-sub {
          position: absolute;
          top: 315px;
          width: 100%;
          text-align: center;
          color: #9ba6b3;
          font-size: 22px;
        }
        .vwl-pill {
          position: absolute;
          left: 300px;
          top: 440px;
          width: 1320px;
          height: 220px;
          padding: 0 42px;
          display: flex;
          align-items: center;
          gap: 6px;
          border: 1px solid rgba(255, 255, 255, 0.16);
          border-radius: 110px;
          background: rgba(255, 255, 255, 0.08);
          box-shadow:
            0 30px 80px rgba(0, 0, 0, 0.4),
            inset 0 1px rgba(255, 255, 255, 0.1);
        }
        .vwl-bar {
          width: 13px;
          height: 5px;
          border-radius: 7px;
          background: var(--accent);
          transform-origin: center;
        }
        .vwl-mic {
          position: absolute;
          left: 860px;
          top: 725px;
          width: 200px;
          height: 76px;
          display: grid;
          place-items: center;
          border-radius: 38px;
          background: #f4f5f7;
          color: #151920;
          font-size: 22px;
          font-weight: 850;
          box-shadow: 0 0 0 rgba(127, 215, 255, 0);
        }
        .vwl-caption {
          position: absolute;
          left: 62px;
          bottom: 48px;
          color: #a9b0ba;
          font-size: 18px;
          font-weight: 800;
          letter-spacing: 4px;
        }
      </style>
      <div
        data-hf-id="hf-vwl-root"
        id="vwl-root"
        data-composition-id="shot-voice-waveform-live"
        data-start="0"
        data-duration="5"
        data-width="1920"
        data-height="1080"
        style="
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
        "
      >
        <div class="vwl-fill">
          <div class="vwl-title">Listening in real time</div>
          <div class="vwl-sub">
            Speak naturally. The signal stays alive through every pause.
          </div>
          <div id="vwl-pill" class="vwl-pill"></div>
          <button id="vwl-mic" class="vwl-mic">SUBMIT VOICE</button>
          <div class="vwl-caption">SPEAK / PAUSE / SPEAK / SUBMIT</div>
        </div>
      </div>
      <script>
        (function () {
          window.__timelines = window.__timelines || {};
          var v = window.__hyperframes.getVariables(),
            fill = document.querySelector("#vwl-root .vwl-fill"),
            host = document.getElementById("vwl-pill"),
            tl = gsap.timeline({ paused: true }),
            bars = [];
          fill.style.setProperty("--accent", v.accent || "#7fd7ff");
          function noise(i, s) {
            var x = Math.sin((i + 1) * 12.9898 + s * 78.233) * 43758.5453;
            return x - Math.floor(x);
          }
          for (var i = 0; i < 64; i++) {
            var b = document.createElement("i");
            b.className = "vwl-bar";
            host.appendChild(b);
            bars.push(b);
            var w = Math.pow(Math.sin(((i + 1) / 65) * Math.PI), 0.8),
              a = 18 + (80 + noise(i, 1) * 95) * w,
              c = 18 + (65 + noise(i, 2) * 110) * w;
            tl.to(
              b,
              {
                height: a,
                duration: 0.12,
                ease: "sine.inOut",
                repeat: 7,
                yoyo: true,
              },
              0.4 + i * 0.012,
            )
              .to(
                b,
                { height: 5, duration: 0.25, ease: "power2.out" },
                2.12 + i * 0.001,
              )
              .to(
                b,
                {
                  height: c,
                  duration: 0.11,
                  ease: "sine.inOut",
                  repeat: 6,
                  yoyo: true,
                },
                2.55 + i * 0.01,
              )
              .to(
                b,
                { scaleY: 0.06, height: 5, duration: 0.4, ease: "power2.in" },
                4,
              );
          }
          tl.to(
            "#vwl-mic",
            {
              boxShadow: "0 0 44px 16px rgba(127,215,255,.32)",
              duration: 0.3,
              yoyo: true,
              repeat: 5,
            },
            0.5,
          ).to(
            "#vwl-mic",
            { scale: 0.82, duration: 0.1, yoyo: true, repeat: 1 },
            4.15,
          );
          window.__timelines["shot-voice-waveform-live"] = tl;
        })();
      </script></template
    >
  </body>
</html>
