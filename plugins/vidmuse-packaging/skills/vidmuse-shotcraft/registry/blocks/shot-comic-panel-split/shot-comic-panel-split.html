<!doctype html>
<html

  <body>
    <template>
      <style>
        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
        .cps-fill {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #fff;
          font-family: Inter, sans-serif;
          --accent: #ff6a48;
        }
        .cps-page {
          position: absolute;
          inset: 0;
          background: #e9e7e0;
          color: #181b19;
        }
        .cps-head {
          position: absolute;
          left: 65px;
          right: 65px;
          top: 55px;
          display: flex;
          justify-content: space-between;
          font-size: 21px;
          font-weight: 900;
        }
        .cps-title {
          position: absolute;
          left: 80px;
          top: 155px;
          width: 660px;
          font-size: 78px;
          line-height: 0.95;
          letter-spacing: -5px;
        }
        .cps-grid {
          position: absolute;
          left: 790px;
          right: 80px;
          top: 135px;
          display: grid;
          grid-template-columns: repeat(2, 1fr);
          gap: 18px;
        }
        .cps-card {
          height: 385px;
          padding: 28px;
          border: 1px solid #c9c5bd;
          border-radius: 24px;
          background: #faf8f3;
        }
        .cps-card i {
          display: block;
          width: 60%;
          height: 13px;
          margin-bottom: 16px;
          border-radius: 8px;
          background: #262a27;
        }
        .cps-card i + i {
          width: 36%;
          background: #b8b5ae;
        }
        .cps-card:after {
          content: "";
          display: block;
          height: 165px;
          margin-top: 60px;
          border-radius: 16px;
          background: linear-gradient(135deg, #d6d2c9, var(--accent));
          opacity: 0.65;
        }
        .cps-kpi {
          position: absolute;
          left: 328px;
          top: 320px;
          width: 380px;
          height: 160px;
          border-radius: 16px;
          background: #faf8f3;
          display: grid;
          place-items: center;
          font-size: 92px;
          font-weight: 950;
          letter-spacing: -4px;
          box-shadow: 0 16px 36px rgba(0, 0, 0, 0.12);
        }
        .cps-panel {
          position: absolute;
          inset: 0;
          opacity: 0;
          transform-origin: 50% 50%;
        }
        .cps-panel .cps-page {
          transform-origin: 50% 50%;
        }
        .cps-p1 {
          clip-path: polygon(0 0, 745px 0, 515px 1080px, 0 1080px);
        }
        .cps-p2 {
          clip-path: polygon(755px 0, 1400px 0, 1170px 1080px, 525px 1080px);
        }
        .cps-p3 {
          clip-path: polygon(1410px 0, 1920px 0, 1920px 1080px, 1180px 1080px);
          z-index: 3;
        }
        .cps-p2 .cps-page {
          transform-origin: 1070px 371px;
        }
        .cps-p3 .cps-page {
          transform-origin: 518px 400px;
        }
        .cps-seams {
          position: absolute;
          inset: 0;
          z-index: 6;
          opacity: 0;
        }
        .cps-seams line.dark {
          stroke: #2f2f2f;
          stroke-width: 16;
        }
        .cps-seams line.light {
          stroke: #fff;
          stroke-width: 10;
        }
        .cps-caption {
          position: absolute;
          left: 58px;
          bottom: 44px;
          z-index: 10;
          padding: 9px 13px;
          border-radius: 5px;
          background: #181b19;
          color: white;
          font-size: 14px;
          font-weight: 850;
          letter-spacing: 3px;
        }
