<!doctype html>
<html
  lang="en"
  data-composition-variables='[{"id":"accent","type":"color","label":"Selection accent","default":"#5b55c8"}]'
>
  <head></head>
  <body>
    <template
      ><style>
        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
        .cps-fill {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #ecebe6;
          font-family: Inter, sans-serif;
          color: #292824;
          --accent: #5b55c8;
        }
        .cps-bg {
          position: absolute;
          inset: 0;
          padding: 90px 120px;
        }
        .cps-titlebar {
          width: 560px;
          height: 58px;
          border-radius: 16px;
          background: #575651;
        }
        .cps-cards {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: 28px;
          margin-top: 60px;
        }
        .cps-card {
          height: 240px;
          border: 1px solid #d2d0ca;
          border-radius: 20px;
          background: #faf9f5;
        }
        .cps-shade {
          position: absolute;
          inset: 0;
          background: rgba(10, 10, 12, 0.56);
          opacity: 0;
        }
        .cps-panel {
          position: absolute;
          left: 560px;
          top: 260px;
          width: 800px;
          overflow: hidden;
          border: 1px solid #4b4a51;
          border-radius: 22px;
          background: #17171a;
          color: #f4f4f6;
          box-shadow: 0 40px 100px rgba(0, 0, 0, 0.5);
          opacity: 0;
        }
        .cps-input {
          height: 88px;
          display: flex;
          align-items: center;
          padding: 0 28px;
          border-bottom: 1px solid #333238;
          font-size: 26px;
        }
        .cps-key {
          margin-left: auto;
          padding: 7px 12px;
          border: 1px solid #55545c;
          border-radius: 8px;
          color: #aaa9b0;
          font-size: 16px;
        }
        .cps-list {
          padding: 12px;
        }
        .cps-row {
          height: 66px;
          display: flex;
          align-items: center;
          padding: 0 18px;
          border-radius: 11px;
          overflow: hidden;
          opacity: 0;
        }
        .cps-icon {
          width: 34px;
          height: 34px;
          margin-right: 16px;
          border-radius: 9px;
          background: #38373d;
        }
        .cps-row small {
          margin-left: auto;
          color: #b5b3bb;
        }
        .cps-row.active {
          border-left: 4px solid var(--accent);
          background: rgba(91, 85, 200, 0.2);
        }
        .cps-caption {
          position: absolute;
          left: 62px;
          bottom: 48px;
          color: #fff;
          font-size: 18px;
          font-weight: 800;
          letter-spacing: 4px;
        }
      </style>
      <div
        data-hf-id="hf-cps-root"
        id="cps-root"
        data-composition-id="shot-command-palette-summon"
        data-start="0"
        data-duration="4.667"
        data-width="1920"
        data-height="1080"
        style="
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
        "
      >
        <div class="cps-fill">
          <div id="cps-bg" class="cps-bg">
            <div class="cps-titlebar"></div>
            <div class="cps-cards">
              <div class="cps-card"></div>
              <div class="cps-card"></div>
              <div class="cps-card"></div>
            </div>
          </div>
          <div id="cps-shade" class="cps-shade"></div>
          <section id="cps-panel" class="cps-panel">
            <div class="cps-input">
              /&nbsp; <span id="cps-query"></span><b id="cps-caret">|</b
              ><span class="cps-key">CMD K</span>
            </div>
            <div id="cps-list" class="cps-list"></div>
          </section>
          <div class="cps-caption">SUMMON · TYPE · NARROW</div>
        </div>
      </div>
      <script>
        (function () {
          window.__timelines = window.__timelines || {};
          var v = window.__hyperframes.getVariables(),
            fill = document.querySelector("#cps-root .cps-fill"),
            host = document.getElementById("cps-list"),
            tl = gsap.timeline({ paused: true }),
            names = [
              "Open project",
              "Create task",
              "Search documents",
              "Invite collaborator",
              "Switch workspace",
            ];
          fill.style.setProperty("--accent", v.accent || "#5b55c8");
          names.forEach(function (n, i) {
            var r = document.createElement("div");
            r.className = "cps-row" + (i === 0 ? " active" : "");
            r.innerHTML =
              '<i class="cps-icon"></i><span>' + n + "</span><small>↵</small>";
            host.appendChild(r);
            tl.fromTo(
              r,
              { y: 12, opacity: 0 },
              { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" },
              1.067 + i * 0.133,
            );
          });
          gsap.set("#cps-panel", { y: -20, scale: 0.98 });
          tl.to("#cps-shade", { opacity: 1, duration: 0.333 }, 0.4)
            .to(
              "#cps-bg",
              { filter: "blur(10px) brightness(.45)", duration: 0.333 },
              0.4,
            )
            .to(
              "#cps-panel",
              {
                y: 8,
                scale: 1,
                opacity: 1,
                duration: 0.4,
                ease: "back.out(1.8)",
              },
              0.6,
            )
            .to("#cps-panel", { y: 0, duration: 0.2 }, 1)
            .call(
              function () {
                document.getElementById("cps-query").textContent = "o";
              },
              null,
              2.067,
            )
            .call(
              function () {
                document.getElementById("cps-query").textContent = "op";
              },
              null,
              2.467,
            )
            .to(
              ".cps-row:nth-child(n+3)",
              {
                height: 0,
                opacity: 0,
                paddingTop: 0,
                paddingBottom: 0,
                duration: 0.4,
                stagger: 0.08,
                ease: "power2.inOut",
              },
              2.5,
            )
            .set("#cps-caret", { opacity: 1 }, 3.1);
          window.__timelines["shot-command-palette-summon"] = tl;
        })();
      </script></template
    >
  </body>
</html>
