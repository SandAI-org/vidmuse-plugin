<!doctype html>
<html
  lang="en"
  data-composition-variables='[{"id":"accent","type":"color","label":"Card accent","default":"#ff6547"}]'
>
  <head></head>
  <body>
    <template>
      <style>
        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
        .sts-fill {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #e9e7e0;
          font-family: Inter, sans-serif;
          color: #181b19;
          --accent: #ff6547;
        }
        .sts-title {
          position: absolute;
          top: 86px;
          width: 100%;
          text-align: center;
          font-size: 64px;
          font-weight: 950;
          letter-spacing: -3px;
          opacity: 0;
        }
        .sts-line {
          position: absolute;
          left: 100px;
          right: 100px;
          top: 694px;
          height: 3px;
          border-radius: 3px;
          background: #b7b5ae;
        }
        .sts-slot {
          position: absolute;
          left: 750px;
          top: 410px;
          width: 420px;
          height: 260px;
          border: 3px dashed #888a85;
          border-radius: 18px;
        }
        .sts-card,
        .sts-ghost {
          position: absolute;
          left: 0;
          top: 410px;
          width: 420px;
          height: 260px;
          padding: 34px;
          border: 1px solid #c8c4bc;
          border-radius: 24px;
          background: #faf8f3;
          box-shadow: 0 22px 50px rgba(0, 0, 0, 0.16);
          transform-origin: 50% 50%;
        }
        .sts-card i,
        .sts-ghost i {
          display: block;
          width: 60%;
          height: 14px;
          margin-bottom: 17px;
          border-radius: 8px;
          background: #242824;
        }
        .sts-card i + i,
        .sts-ghost i + i {
          width: 36%;
          background: #b7b5ae;
        }
        .sts-card:after,
        .sts-ghost:after {
          content: "";
          display: block;
          height: 110px;
          margin-top: 48px;
          border-radius: 15px;
          background: linear-gradient(135deg, var(--accent), #ffc8ba);
        }
        .sts-ghost {
          opacity: 0;
        }
        .sts-badge {
          position: absolute;
          left: 120px;
          top: 155px;
          padding-bottom: 7px;
          border-bottom: 6px solid #181b19;
          font-family: monospace;
          font-size: 84px;
          font-weight: 900;
          transform-origin: 0 50%;
        }
        .sts-caption {
          position: absolute;
          left: 58px;
          bottom: 44px;
          color: #585a56;
          font-size: 14px;
          font-weight: 850;
          letter-spacing: 3px;
        }
      </style>
      <div
        id="sts-root"
        data-hf-id="hf-sts-root"
        data-composition-id="shot-sakuga-timing-shift"
        data-start="0"
        data-duration="4.333"
        data-width="1920"
        data-height="1080"
        style="
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
        "
      >
        <div class="sts-fill">
          <div class="sts-title">SAKUGA TIMING SHIFT</div>
          <div class="sts-line"></div>
          <div class="sts-slot"></div>
          <div id="sts-g2" class="sts-ghost"><i></i><i></i></div>
          <div id="sts-g1" class="sts-ghost"><i></i><i></i></div>
          <div id="sts-card" class="sts-card"><i></i><i></i></div>
          <div id="sts-badge" class="sts-badge">on 3s</div>
          <div class="sts-caption">STEPPED 10FPS / FLUID 30FPS</div>
        </div>
      </div>
      <script>
        (function () {
          window.__timelines = window.__timelines || {};
          var v = window.__hyperframes.getVariables(),
            fill = document.querySelector("#sts-root .sts-fill"),
            tl = gsap.timeline({ paused: true }),
            card = document.getElementById("sts-card"),
            badge = document.getElementById("sts-badge");
          fill.style.setProperty("--accent", v.accent || "#ff6547");
          gsap.set(card, { x: 120 });
          gsap.set("#sts-g1,#sts-g2", { x: 1380 });
          tl.to(
            ".sts-title",
            { opacity: 1, duration: 0.333, ease: "power2.out" },
            0,
          );
          for (var i = 1; i <= 16; i++) {
            var t = i * 0.1,
              x = 120 + (1260 * i) / 16,
              r = Math.sin(i * 2.1) * 5;
            tl.set(card, { x: x, rotation: r }, t);
          }
          for (var j = 0; j < 12; j++) {
            var bt = j * 0.133,
              bx = ((j * 17) % 7) - 3,
              by = ((j * 29) % 7) - 3,
              br = ((j * 11) % 5) - 2;
            tl.to(
              badge,
              { x: bx, y: by, rotation: br, duration: 0.001, ease: "none" },
              bt,
            );
          }
          tl.call(
            function () {
              badge.textContent = "on 1s";
            },
            null,
            1.6,
          )
            .set(badge, { scale: 1.35 }, 1.6)
            .to(badge, { scale: 1, duration: 0.3, ease: "power3.out" }, 1.601)
            .set("#sts-g1", { opacity: 0.28, x: 1380 }, 1.633)
            .set("#sts-g2", { opacity: 0.13, x: 1380 }, 1.633)
            .to(
              card,
              {
                x: 714,
                rotation: 0,
                scaleX: 1.35,
                scaleY: 0.88,
                duration: 0.733,
                ease: "power4.out",
              },
              1.6,
            )
            .to(
              "#sts-g1",
              { x: 770, opacity: 0, duration: 0.7, ease: "power4.out" },
              1.666,
            )
            .to(
              "#sts-g2",
              { x: 840, opacity: 0, duration: 0.67, ease: "power4.out" },
              1.733,
            )
            .to(
              card,
              {
                x: 750,
                scaleX: 0.9,
                scaleY: 1.07,
                duration: 0.1,
                ease: "power2.out",
              },
              2.334,
            )
            .to(
              card,
              { scaleX: 1, scaleY: 1, duration: 0.1, ease: "power3.out" },
              2.435,
            );
          window.__timelines["shot-sakuga-timing-shift"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
