<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Semantic Dataviz Verify — KPI / Bars / Sparkline</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #07060c;
        color: #f4efff;
        font-family: Inter, "SF Pro Display", system-ui, sans-serif;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background:
          radial-gradient(ellipse 70% 55% at 50% 40%, rgba(124, 58, 237, 0.22), transparent 60%),
          radial-gradient(ellipse 40% 35% at 80% 80%, rgba(88, 28, 135, 0.18), transparent 55%),
          #07060c;
      }
      .clip {
        position: absolute;
        inset: 0;
      }

      /* --- layout: three evidence cards --- */
      .stage {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 36px;
        padding: 72px 64px;
      }
      .card {
        width: 540px;
        height: 720px;
        border-radius: 28px;
        background: linear-gradient(165deg, #1a1028 0%, #0c0a14 55%, #09070f 100%);
        border: 1px solid rgba(168, 130, 255, 0.14);
        box-shadow:
          0 30px 80px rgba(0, 0, 0, 0.45),
          inset 0 1px 0 rgba(255, 255, 255, 0.04);
        padding: 48px 40px 40px;
        display: flex;
        flex-direction: column;
        position: relative;
        overflow: hidden;
      }
      .card::before {
        content: "";
        position: absolute;
        inset: -20% -10% auto auto;
        width: 70%;
        height: 55%;
        background: radial-gradient(circle, rgba(168, 85, 247, 0.22), transparent 70%);
        pointer-events: none;
      }

      /* Card A — KPI glow count */
      .kpi-label {
        font-size: 28px;
        font-weight: 600;
        letter-spacing: 0.01em;
        color: rgba(244, 239, 255, 0.78);
        text-align: center;
        margin-top: 120px;
      }
      .kpi-wrap {
        margin-top: 36px;
        display: flex;
        justify-content: center;
        align-items: baseline;
        width: 100%;
        min-height: 160px;
      }
      .kpi {
        font-variant-numeric: tabular-nums;
        font-size: 118px;
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1;
        color: #e9d5ff;
        text-shadow:
          0 0 18px rgba(233, 213, 255, 0.95),
          0 0 48px rgba(192, 132, 252, 0.7),
          0 0 110px rgba(168, 85, 247, 0.5);
        display: inline-block;
        transform-origin: center center;
        will-change: transform, opacity;
      }

      /* Card B — weekly bars */
      .card-title {
        font-size: 34px;
        font-weight: 700;
        margin: 8px 0 0;
        letter-spacing: -0.02em;
      }
      .card-sub {
        margin-top: 10px;
        font-size: 20px;
        color: rgba(244, 239, 255, 0.55);
      }
      .bars-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding-bottom: 12px;
      }
      .bars {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 18px;
        height: 360px;
        padding: 0 8px;
      }
      .bar-col {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }
      .bar-val {
        font-size: 18px;
        font-weight: 600;
        color: rgba(244, 239, 255, 0.88);
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      .bar {
        width: 100%;
        max-width: 56px;
        border-radius: 10px 10px 6px 6px;
        background: linear-gradient(180deg, #e9d5ff 0%, #a855f7 42%, #7c3aed 100%);
        box-shadow: 0 0 24px rgba(168, 85, 247, 0.35);
        transform-origin: bottom center;
        will-change: transform;
      }
      .bar-lab {
        font-size: 18px;
        font-weight: 600;
        color: rgba(244, 239, 255, 0.5);
      }

      /* Card C — sparkline */
      .chart-box {
        margin-top: 48px;
        flex: 1;
        border-radius: 18px;
        background: rgba(12, 8, 22, 0.65);
        border: 1px solid rgba(168, 130, 255, 0.12);
        position: relative;
        overflow: hidden;
        padding: 28px 20px 24px;
      }
      .chart-box svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .grid-line {
        stroke: rgba(244, 239, 255, 0.08);
        stroke-width: 1;
      }
      .grid-label {
        fill: rgba(244, 239, 255, 0.72);
        font-size: 14px;
        font-family: Inter, system-ui, sans-serif;
      }
      .spark-area {
        fill: url(#sparkFill);
        opacity: 0.35;
      }
      .spark-line {
        fill: none;
        stroke: #d8b4fe;
        stroke-width: 3.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: drop-shadow(0 0 6px rgba(216, 180, 254, 0.8));
      }
      .spark-dot {
        fill: #f3e8ff;
        filter: drop-shadow(0 0 8px rgba(216, 180, 254, 0.95));
      }
      .y-axis-title {
        position: absolute;
        top: 18px;
        right: 22px;
        font-size: 16px;
        font-weight: 600;
        color: rgba(244, 239, 255, 0.55);
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <!--
      SEMANTIC COMPOSE (verify for motion-recipes):
      - recipe:kpi-glow-count     → counting-dynamic-scale + glow CSS
      - recipe:weekly-bar-rise    → stat-bars-and-fills (scaleY stagger)
      - recipe:sparkline-draw     → svg-path-draw (strokeDashoffset)
      - recipe:stat-card-trio     → card entrances in sequence
      - blueprint touch: dataviz-countup (numbers/charts as hero)
      Registry: NONE. Pure HyperFrames HTML + GSAP.
      Data from product mock (fixed, never invented mid-render).
    -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="9"
    >
      <section id="scene-dataviz" class="clip" data-start="0" data-duration="9" data-track-index="1">
        <div class="stage">
          <!-- A: KPI -->
          <article class="card" id="card-kpi" data-recipe="kpi-glow-count">
            <div class="kpi-label">My Monthly AdSense Income</div>
            <div class="kpi-wrap">
              <span class="kpi" id="kpi">$0</span>
            </div>
          </article>

          <!-- B: Bars -->
          <article class="card" id="card-bars" data-recipe="weekly-bar-rise">
            <h2 class="card-title">Daily Check-ins</h2>
            <div class="card-sub">Week 1 – Week 6 Progress</div>
            <div class="bars-area">
              <div class="bars" id="bars">
                <!-- heights fixed in CSS; GSAP only scaleY -->
                <div class="bar-col">
                  <span class="bar-val">3 days</span>
                  <div class="bar" style="height: 54px"></div>
                  <span class="bar-lab">W1</span>
                </div>
                <div class="bar-col">
                  <span class="bar-val">5 days</span>
                  <div class="bar" style="height: 90px"></div>
                  <span class="bar-lab">W2</span>
                </div>
                <div class="bar-col">
                  <span class="bar-val">7 days</span>
                  <div class="bar" style="height: 126px"></div>
                  <span class="bar-lab">W3</span>
                </div>
                <div class="bar-col">
                  <span class="bar-val">12 days</span>
                  <div class="bar" style="height: 216px"></div>
                  <span class="bar-lab">W4</span>
                </div>
                <div class="bar-col">
                  <span class="bar-val">17 days</span>
                  <div class="bar" style="height: 306px"></div>
                  <span class="bar-lab">W5</span>
                </div>
                <div class="bar-col">
                  <span class="bar-val">17 days</span>
                  <div class="bar" style="height: 306px"></div>
                  <span class="bar-lab">W6</span>
                </div>
              </div>
            </div>
          </article>

          <!-- C: Sparkline -->
          <article class="card" id="card-line" data-recipe="sparkline-draw">
            <h2 class="card-title">Retention Graph</h2>
            <div class="card-sub">Cohort shape · demo series</div>
            <div class="chart-box">
              <div class="y-axis-title">High → Low</div>
              <svg viewBox="0 0 440 420" preserveAspectRatio="none" aria-hidden="true">
                <defs>
                  <linearGradient id="sparkFill" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#c084fc" stop-opacity="0.55" />
                    <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
                  </linearGradient>
                </defs>
                <!-- grid -->
                <line class="grid-line" x1="48" y1="48" x2="420" y2="48" />
                <line class="grid-line" x1="48" y1="128" x2="420" y2="128" />
                <line class="grid-line" x1="48" y1="208" x2="420" y2="208" />
                <line class="grid-line" x1="48" y1="288" x2="420" y2="288" />
                <line class="grid-line" x1="48" y1="368" x2="420" y2="368" />
                <text class="grid-label" x="8" y="52">High</text>
                <text class="grid-label" x="8" y="132">Above</text>
                <text class="grid-label" x="8" y="212">Avg</text>
                <text class="grid-label" x="8" y="292">Below</text>
                <text class="grid-label" x="8" y="372">Low</text>
                <!--
                  Series (x 48→400, y inverse high=low-y):
                  peak early then gentle decay with small recovery
                -->
                <path
                  id="spark-area"
                  class="spark-area"
                  d="M48,220 C90,60 120,50 150,70 C190,95 210,150 240,175 C280,205 300,195 330,185 C360,175 385,200 400,210 L400,368 L48,368 Z"
                />
                <path
                  id="spark-line"
                  class="spark-line"
                  d="M48,220 C90,60 120,50 150,70 C190,95 210,150 240,175 C280,205 300,195 330,185 C360,175 385,200 400,210"
                />
                <circle id="spark-dot" class="spark-dot" cx="400" cy="210" r="6" />
              </svg>
            </div>
          </article>
        </div>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ---------- Card entrance (stat-card-trio) ----------
      gsap.set(["#card-kpi", "#card-bars", "#card-line"], {
        opacity: 0,
        y: 40,
        scale: 0.96,
      });
      tl.to(
        ["#card-kpi", "#card-bars", "#card-line"],
        {
          opacity: 1,
          y: 0,
          scale: 1,
          duration: 0.7,
          ease: "power3.out",
          stagger: 0.12,
        },
        0.15,
      );

      // ---------- A: kpi-glow-count (counting-dynamic-scale) ----------
      const kpiEl = document.getElementById("kpi");
      const kpiState = { value: 0 };
      const TARGET = 9946;
      const START_SCALE = 0.72;
      gsap.set(kpiEl, { scale: START_SCALE, opacity: 0 });

      tl.to(kpiEl, { opacity: 1, duration: 0.25, ease: "power1.out" }, 0.55);
      tl.to(
        kpiState,
        {
          value: TARGET,
          duration: 1.65,
          ease: "power2.out",
          onUpdate: () => {
            kpiEl.textContent =
              "$" + Math.round(kpiState.value).toLocaleString("en-US");
          },
        },
        0.55,
      );
      tl.to(
        kpiEl,
        { scale: 1, duration: 1.65, ease: "power2.out" },
        0.55,
      );

      // ---------- B: weekly-bar-rise (stat-bars-and-fills) ----------
      const bars = gsap.utils.toArray("#bars .bar");
      const barVals = gsap.utils.toArray("#bars .bar-val");
      const barLabs = gsap.utils.toArray("#bars .bar-lab");
      gsap.set(barVals, { opacity: 0, y: 8 });
      gsap.set(barLabs, { opacity: 0 });
      const BAR_T0 = 2.4;
      // Hide before beat (t0>0). GSAP owns transform — never CSS transform on .bar
      gsap.set(bars, { scaleY: 0, transformOrigin: "bottom center" });
      tl.fromTo(
        bars,
        { scaleY: 0, transformOrigin: "bottom center" },
        {
          scaleY: 1,
          duration: 0.75,
          ease: "power3.out",
          stagger: 0.08,
          immediateRender: false,
        },
        BAR_T0,
      );
      tl.to(
        barVals,
        {
          opacity: 1,
          y: 0,
          duration: 0.35,
          ease: "power2.out",
          stagger: 0.08,
        },
        BAR_T0 + 0.45,
      );
      tl.to(
        barLabs,
        {
          opacity: 1,
          duration: 0.3,
          stagger: 0.08,
        },
        BAR_T0 + 0.2,
      );

      // ---------- C: sparkline-draw (svg-path-draw) ----------
      const line = document.getElementById("spark-line");
      const area = document.getElementById("spark-area");
      const dot = document.getElementById("spark-dot");
      const lineLen = line.getTotalLength();
      line.style.strokeDasharray = String(lineLen);
      line.style.strokeDashoffset = String(lineLen);
      gsap.set(area, { opacity: 0 });
      gsap.set(dot, { opacity: 0, scale: 0, transformOrigin: "center center" });

      const LINE_T0 = 4.8;
      tl.to(
        line,
        {
          strokeDashoffset: 0,
          duration: 1.5,
          ease: "power2.inOut",
        },
        LINE_T0,
      );
      tl.to(area, { opacity: 0.35, duration: 0.7, ease: "power1.out" }, LINE_T0 + 0.55);
      tl.to(
        dot,
        { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" },
        LINE_T0 + 1.35,
      );

      // hold final readable state through data-duration
      tl.to({}, { duration: 1.8 }, LINE_T0 + 1.7);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
